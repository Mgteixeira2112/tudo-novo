name: Apply API lockdown patch

on:
  push:
    branches:
      - refactor/fase-01-fechamento-apis
    paths:
      - '.github/workflows/apply-api-lockdown-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/fase-01-fechamento-apis

      - name: Apply API lockdown
        shell: python
        run: |
          from pathlib import Path

          p = Path('server.ts')
          t = p.read_text(encoding='utf-8')

          route_replacements = {
            "app.post('/api/guests', (req: Request, res: Response) => {": "app.post('/api/guests', requireSupabaseAuth, requirePermission('manage_guests'), (req: Request, res: Response) => {",
            "app.put('/api/guests/:id', (req: Request, res: Response) => {": "app.put('/api/guests/:id', requireSupabaseAuth, requirePermission('manage_guests'), (req: Request, res: Response) => {",
            "app.delete('/api/guests/:id', (req: Request, res: Response) => {": "app.delete('/api/guests/:id', requireSupabaseAuth, requirePermission('manage_guests'), (req: Request, res: Response) => {",
            "app.post('/api/rooms', (req: Request, res: Response) => {": "app.post('/api/rooms', requireSupabaseAuth, requirePermission('manage_rooms'), (req: Request, res: Response) => {",
            "app.put('/api/rooms/:id', (req: Request, res: Response) => {": "app.put('/api/rooms/:id', requireSupabaseAuth, requirePermission('manage_rooms'), (req: Request, res: Response) => {",
            "app.patch('/api/rooms/:id/status', (req: Request, res: Response) => {": "app.patch('/api/rooms/:id/status', requireSupabaseAuth, requirePermission('manage_rooms'), (req: Request, res: Response) => {",
            "app.delete('/api/rooms/:id', (req: Request, res: Response) => {": "app.delete('/api/rooms/:id', requireSupabaseAuth, requirePermission('manage_rooms'), (req: Request, res: Response) => {",
            "app.put('/api/reservations/:id', (req: Request, res: Response) => {": "app.put('/api/reservations/:id', requireSupabaseAuth, requirePermission('manage_checkinout'), (req: Request, res: Response) => {",
            "app.post('/api/checkin', (req: Request, res: Response) => {": "app.post('/api/checkin', requireSupabaseAuth, requirePermission('manage_checkinout'), (req: Request, res: Response) => {",
            "app.post('/api/checkout', (req: Request, res: Response) => {": "app.post('/api/checkout', requireSupabaseAuth, requirePermission('manage_checkinout'), (req: Request, res: Response) => {",
            "app.post('/api/minibar/items', (req: Request, res: Response) => {": "app.post('/api/minibar/items', requireSupabaseAuth, requirePermission('manage_fnb'), (req: Request, res: Response) => {",
            "app.put('/api/minibar/items/:id', (req: Request, res: Response) => {": "app.put('/api/minibar/items/:id', requireSupabaseAuth, requirePermission('manage_fnb'), (req: Request, res: Response) => {",
            "app.patch('/api/minibar/items/:id/restock', (req: Request, res: Response) => {": "app.patch('/api/minibar/items/:id/restock', requireSupabaseAuth, requirePermission('manage_fnb'), (req: Request, res: Response) => {",
            "app.delete('/api/minibar/items/:id', (req: Request, res: Response) => {": "app.delete('/api/minibar/items/:id', requireSupabaseAuth, requirePermission('manage_fnb'), (req: Request, res: Response) => {",
            "app.post('/api/minibar/consumptions', (req: Request, res: Response) => {": "app.post('/api/minibar/consumptions', requireSupabaseAuth, requirePermission('manage_fnb'), (req: Request, res: Response) => {",
            "app.patch('/api/kitchen/orders/:id/status', (req: Request, res: Response) => {": "app.patch('/api/kitchen/orders/:id/status', requireSupabaseAuth, requirePermission('manage_fnb'), (req: Request, res: Response) => {",
            "app.post('/api/tasks', (req: Request, res: Response) => {": "app.post('/api/tasks', requireSupabaseAuth, (req: Request, res: Response) => {",
            "app.patch('/api/tasks/:id', (req: Request, res: Response) => {": "app.patch('/api/tasks/:id', requireSupabaseAuth, (req: Request, res: Response) => {",
            "app.delete('/api/tasks/:id', (req: Request, res: Response) => {": "app.delete('/api/tasks/:id', requireSupabaseAuth, (req: Request, res: Response) => {",
            "app.post('/api/financial/transactions', (req: Request, res: Response) => {": "app.post('/api/financial/transactions', requireSupabaseAuth, requirePermission('manage_financial'), (req: Request, res: Response) => {",
            "app.get('/api/inventory/items', (req: Request, res: Response) => {": "app.get('/api/inventory/items', requireSupabaseAuth, requirePermission('view_inventory'), (req: Request, res: Response) => {",
            "app.get('/api/inventory/items/:id', (req: Request, res: Response) => {": "app.get('/api/inventory/items/:id', requireSupabaseAuth, requirePermission('view_inventory'), (req: Request, res: Response) => {",
            "app.post('/api/inventory/items', (req: Request, res: Response) => {": "app.post('/api/inventory/items', requireSupabaseAuth, requirePermission('manage_inventory'), (req: Request, res: Response) => {",
            "app.put('/api/inventory/items/:id', (req: Request, res: Response) => {": "app.put('/api/inventory/items/:id', requireSupabaseAuth, requirePermission('manage_inventory'), (req: Request, res: Response) => {",
            "app.delete('/api/inventory/items/:id', (req: Request, res: Response) => {": "app.delete('/api/inventory/items/:id', requireSupabaseAuth, requirePermission('manage_inventory'), (req: Request, res: Response) => {",
            "app.post('/api/inventory/movements', (req: Request, res: Response) => {": "app.post('/api/inventory/movements', requireSupabaseAuth, requirePermission('manage_inventory'), (req: Request, res: Response) => {",
            "app.get('/api/inventory/movements', (req: Request, res: Response) => {": "app.get('/api/inventory/movements', requireSupabaseAuth, requirePermission('view_inventory'), (req: Request, res: Response) => {",
            "app.get('/api/inventory/stats', (req: Request, res: Response) => {": "app.get('/api/inventory/stats', requireSupabaseAuth, requirePermission('view_inventory'), (req: Request, res: Response) => {",
            "app.post('/api/inventory/replenish-order', (req: Request, res: Response) => {": "app.post('/api/inventory/replenish-order', requireSupabaseAuth, requirePermission('manage_inventory'), (req: Request, res: Response) => {",
            "app.get('/api/supabase/schema-sql', (req: Request, res: Response) => {": "app.get('/api/supabase/schema-sql', requireSupabaseAuth, requirePermission('manage_settings'), (req: Request, res: Response) => {",
            "app.post('/api/supabase/reconnect', requireSupabaseAuth, (req: Request, res: Response) => {": "app.post('/api/supabase/reconnect', requireSupabaseAuth, requirePermission('manage_settings'), (req: Request, res: Response) => {",
          }

          missing = []
          for old, new in route_replacements.items():
            if old not in t:
              missing.append(old)
            else:
              t = t.replace(old, new, 1)
          if missing:
            raise SystemExit('Missing route anchors: ' + '\n'.join(missing))

          old_autocreate = """    let user = dbManager.getUserByEmail(verifiedEmail);\n\n    // Create the local staff profile only after Supabase has verified the identity.\n    if (!user) {\n      user = dbManager.createUser({\n        email: verifiedEmail,\n        fullName: String(authData.user.user_metadata?.full_name || verifiedEmail.split('@')[0]),\n        role: 'recepcionista',\n        sector: 'Recepcao',\n        status: 'Ativo',\n        permissions: ['view_rooms', 'view_checkinout', 'manage_checkinout', 'view_guests', 'view_kanbans'],\n        supabaseAuthId: authData.user.id\n      });\n    }\n\n    if (user.status !== 'Ativo') {"""
          new_autocreate = """    const user = dbManager.getUserByEmail(verifiedEmail);\n\n    // Supabase identity alone never grants hotel staff access.\n    // A staff profile must be provisioned beforehand by an authorized manager/admin.\n    if (!user) {\n      return res.status(403).json({\n        error: 'Conta autenticada, mas sem perfil de colaborador autorizado neste hotel.'\n      });\n    }\n\n    if (user.status !== 'Ativo') {"""
          if old_autocreate not in t:
            raise SystemExit('Login autocreate block anchor not found')
          t = t.replace(old_autocreate, new_autocreate, 1)

          old_register_response = """    res.status(201).json({\n      user: newUser,\n      token: `staff_token_${newUser.id}_${Date.now()}`\n    });"""
          new_register_response = """    res.status(201).json({ user: newUser });"""
          if old_register_response not in t:
            raise SystemExit('Register response anchor not found')
          t = t.replace(old_register_response, new_register_response, 1)
          p.write_text(t, encoding='utf-8')

          p = Path('src/services/api.ts')
          t = p.read_text(encoding='utf-8')
          t = t.replace("headers: { 'Content-Type': 'application/json' }", "headers: protectedHeaders()")
          t = t.replace("{ method: 'DELETE' }", "{ method: 'DELETE', headers: protectedHeaders() }")
          t = t.replace("getSupabaseSQL: () => fetch(`${BASE_URL}/supabase/schema-sql`).then(r => r.text()),", "getSupabaseSQL: () => fetch(`${BASE_URL}/supabase/schema-sql`, { headers: protectedHeaders() }).then(r => r.text()),")
          t = t.replace("return fetch(`${BASE_URL}/inventory/items${query}`).then(r => handleResponse<InventoryItem[]>(r));", "return fetch(`${BASE_URL}/inventory/items${query}`, { headers: protectedHeaders() }).then(r => handleResponse<InventoryItem[]>(r));")
          t = t.replace("getInventoryItem: (id: string) => fetch(`${BASE_URL}/inventory/items/${id}`).then(r => handleResponse<InventoryItem>(r)),", "getInventoryItem: (id: string) => fetch(`${BASE_URL}/inventory/items/${id}`, { headers: protectedHeaders() }).then(r => handleResponse<InventoryItem>(r)),")
          t = t.replace("return fetch(`${BASE_URL}/inventory/movements${query}`).then(r => handleResponse<StockMovement[]>(r));", "return fetch(`${BASE_URL}/inventory/movements${query}`, { headers: protectedHeaders() }).then(r => handleResponse<StockMovement[]>(r));")
          t = t.replace("getInventoryStats: () => fetch(`${BASE_URL}/inventory/stats`).then(r => handleResponse<InventoryStats>(r)),", "getInventoryStats: () => fetch(`${BASE_URL}/inventory/stats`, { headers: protectedHeaders() }).then(r => handleResponse<InventoryStats>(r)),")
          p.write_text(t, encoding='utf-8')

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/api.ts
          git commit -m "security: close operational mutations and require provisioned staff" || exit 0
          git push origin HEAD:refactor/fase-01-fechamento-apis
