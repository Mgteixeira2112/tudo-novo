name: Apply Phase 3.3 FNB
on:
  push:
    branches: [phase3/fnb-atomic]
    paths:
      - 'scripts/apply_phase33_fnb.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/apply_phase33_fnb.py
      - name: Install and build
        run: npm install && npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/financeInventoryPages.ts src/services/pagesData.ts server.ts
          git commit -m "feat: tornar frigobar e room service transacionais" || exit 0
          git push
