name: Apply Kanban edit hotfix
on:
  push:
    branches: [fix/kanban-edit-task]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kanban-edit-task
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Kanban edit flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/KanbanBoard.tsx')
          s=p.read_text()

          s=s.replace('  Trash2,\n', '  Trash2,\n  Pencil,\n', 1)
          s=s.replace("  const [showNewTaskModal, setShowNewTaskModal] = useState(false);", "  const [showNewTaskModal, setShowNewTaskModal] = useState(false);\n  const [editingTaskId, setEditingTaskId] = useState<string | null>(null);", 1)

          anchor="""  const [submitting, setSubmitting] = useState(false);\n\n  // Filter tasks"""
          insert="""  const [submitting, setSubmitting] = useState(false);\n\n  const resetTaskForm = () => {\n    setTaskTitle('');\n    setTaskDescription('');\n    setTaskSector('Governanca');\n    setTaskPriority('Media');\n    setTaskRoomNumber('');\n    setTaskAssignedTo('');\n    setEditingTaskId(null);\n  };\n\n  const handleOpenNewTask = () => {\n    resetTaskForm();\n    setShowNewTaskModal(true);\n  };\n\n  const handleOpenEditTask = (task: KanbanTask) => {\n    setEditingTaskId(task.id);\n    setTaskTitle(task.title || '');\n    setTaskDescription(task.description || '');\n    setTaskSector(task.sector);\n    setTaskPriority(task.priority);\n    setTaskRoomNumber(task.roomNumber || '');\n    setTaskAssignedTo(task.assignedTo || '');\n    setShowNewTaskModal(true);\n  };\n\n  // Filter tasks"""
          if anchor not in s: raise SystemExit('state anchor not found')
          s=s.replace(anchor,insert,1)

          old="""      await api.createTask({\n        title: taskTitle,\n        description: taskDescription,\n        sector: taskSector,\n        status: 'A_Fazer',\n        priority: taskPriority,\n        roomNumber: taskRoomNumber || undefined,\n        assignedTo: taskAssignedTo || undefined\n      });\n\n      setTaskTitle('');\n      setTaskDescription('');\n      setTaskRoomNumber('');\n      setTaskAssignedTo('');\n      setShowNewTaskModal(false);"""
          new="""      const payload = {\n        title: taskTitle.trim(),\n        description: taskDescription,\n        sector: taskSector,\n        priority: taskPriority,\n        roomNumber: taskRoomNumber || undefined,\n        assignedTo: taskAssignedTo || undefined\n      };\n\n      if (editingTaskId) {\n        await api.updateTask(editingTaskId, payload);\n      } else {\n        await api.createTask({ ...payload, status: 'A_Fazer' });\n      }\n\n      resetTaskForm();\n      setShowNewTaskModal(false);"""
          if old not in s: raise SystemExit('submit anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("      console.error('Error creating task:', err);", "      console.error(editingTaskId ? 'Error editing task:' : 'Error creating task:', err);", 1)

          oldbtn="""        <button\n          onClick={() => handleDeleteTask(task.id)}\n          className=\"text-[#8E9280] hover:text-rose-700 transition p-1 opacity-0 group-hover:opacity-100\"\n          title=\"Excluir tarefa\"\n        >\n          <Trash2 className=\"w-3.5 h-3.5\" />\n        </button>"""
          newbtn="""        <div className=\"flex items-center gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition\">\n          <button\n            onClick={() => handleOpenEditTask(task)}\n            className=\"text-[#8E9280] hover:text-[#2C3327] transition p-1\"\n            title=\"Editar tarefa\"\n            aria-label=\"Editar tarefa\"\n          >\n            <Pencil className=\"w-3.5 h-3.5\" />\n          </button>\n          <button\n            onClick={() => handleDeleteTask(task.id)}\n            className=\"text-[#8E9280] hover:text-rose-700 transition p-1\"\n            title=\"Excluir tarefa\"\n            aria-label=\"Excluir tarefa\"\n          >\n            <Trash2 className=\"w-3.5 h-3.5\" />\n          </button>\n        </div>"""
          if oldbtn not in s: raise SystemExit('card action anchor not found')
          s=s.replace(oldbtn,newbtn,1)

          s=s.replace("onClick={() => setShowNewTaskModal(true)}", "onClick={handleOpenNewTask}", 1)

          # Improve modal labels when their common text exists, without changing the top trigger.
          s=s.replace('Nova Tarefa Operacional', "{editingTaskId ? 'Editar Tarefa Operacional' : 'Nova Tarefa Operacional'}")
          s=s.replace('Criar Tarefa', "{editingTaskId ? 'Salvar Alterações' : 'Criar Tarefa'}")

          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name "Mgteixeira2112"
          git config user.email "102971119+Mgteixeira2112@users.noreply.github.com"
          git add src/components/KanbanBoard.tsx
          git commit -m "fix: adicionar edição de tarefas no Kanban" || exit 0
          git push origin HEAD:fix/kanban-edit-task