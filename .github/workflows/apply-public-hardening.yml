name: Apply public endpoint hardening
on:
  push:
    branches: [refactor/fase-01-public-hardening]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fase-01-public-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hardening patch
        run: python scripts/apply_public_hardening.py
      - name: Validate full build
        run: |
          npm install
          npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.ts docs/FASE-01-06-PUBLIC-ENDPOINT-HARDENING.md
          git commit -m "security: harden public reservation and room service endpoints" || exit 0
          git push
