name: Apply phase 2.2
on:
  push:
    branches: [refactor/fase-02-02-settings-supabase]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fase-02-02-settings-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Supabase settings repository and staff auth profile
        run: |
          python - <<'PY'
          from pathlib import Path

          # --- server/db.ts ---
          p = Path('server/db.ts')
          s = p.read_text()
          old = '''  // --- Settings ---\n  public getSettings(): HotelSettings {\n    return this.data.settings;\n  }\n\n  public updateSettings(updates: Partial<HotelSettings>): HotelSettings {\n    this.data.settings = { ...this.data.settings, ...updates };\n    this.persist();\n    return this.data.settings;\n  }\n'''
          new = '''  // --- Settings ---\n  // Transitional repository: Supabase is preferred when the server has credentials;\n  // the local JSON object remains a temporary cache/fallback until Phase 2.7.\n  private mapSettingsFromSupabase(row: any): HotelSettings {\n    return {\n      id: row.id,\n      hotelName: row.hotel_name,\n      tagline: row.tagline || '',\n      description: row.description || '',\n      logoIcon: row.logo_icon || 'hotel',\n      primaryColor: row.primary_color || 'emerald',\n      currency: row.currency || 'R$',\n      taxRatePercent: Number(row.tax_rate_percent || 0),\n      checkInTime: row.check_in_time || '14:00',\n      checkOutTime: row.check_out_time || '11:00',\n      address: row.address || '',\n      cityState: row.city_state || '',\n      phone: row.phone || '',\n      email: row.email || '',\n      bookingPolicies: row.booking_policies || '',\n      wifiPassword: row.wifi_password || '',\n      roomTypes: Array.isArray(row.room_types) ? row.room_types : []\n    } as HotelSettings;\n  }\n\n  private mapSettingsToSupabase(settings: HotelSettings) {\n    return {\n      id: settings.id || 'hotel_1',\n      hotel_name: settings.hotelName,\n      tagline: settings.tagline,\n      description: settings.description,\n      logo_icon: settings.logoIcon,\n      primary_color: settings.primaryColor,\n      currency: settings.currency,\n      tax_rate_percent: settings.taxRatePercent,\n      check_in_time: settings.checkInTime,\n      check_out_time: settings.checkOutTime,\n      address: settings.address,\n      city_state: settings.cityState,\n      phone: settings.phone,\n      email: settings.email,\n      booking_policies: settings.bookingPolicies,\n      wifi_password: settings.wifiPassword,\n      room_types: settings.roomTypes || [],\n      updated_at: new Date().toISOString()\n    };\n  }\n\n  public getSettings(): HotelSettings {\n    return this.data.settings;\n  }\n\n  public async getSettingsPersistent(): Promise<HotelSettings> {\n    if (!this.supabase) return this.getSettings();\n    try {\n      const { data, error } = await this.supabase\n        .from('hotel_settings')\n        .select('*')\n        .eq('id', 'hotel_1')\n        .maybeSingle();\n      if (error) throw error;\n      if (!data) return this.getSettings();\n      const settings = this.mapSettingsFromSupabase(data);\n      this.data.settings = settings;\n      this.persist();\n      return settings;\n    } catch (err) {\n      console.warn('[Supabase] Falha ao ler hotel_settings; usando fallback JSON temporário:', err);\n      return this.getSettings();\n    }\n  }\n\n  public updateSettings(updates: Partial<HotelSettings>): HotelSettings {\n    this.data.settings = { ...this.data.settings, ...updates };\n    this.persist();\n    return this.data.settings;\n  }\n\n  public async updateSettingsPersistent(updates: Partial<HotelSettings>): Promise<HotelSettings> {\n    const merged = { ...this.data.settings, ...updates } as HotelSettings;\n    if (!this.supabase) return this.updateSettings(updates);\n    try {\n      const { data, error } = await this.supabase\n        .from('hotel_settings')\n        .upsert(this.mapSettingsToSupabase(merged), { onConflict: 'id' })\n        .select('*')\n        .single();\n      if (error) throw error;\n      const settings = this.mapSettingsFromSupabase(data);\n      this.data.settings = settings;\n      this.persist();\n      return settings;\n    } catch (err) {\n      console.warn('[Supabase] Falha ao gravar hotel_settings; usando fallback JSON temporário:', err);\n      return this.updateSettings(updates);\n    }\n  }\n'''
          if old not in s:
              raise SystemExit('settings block not found in server/db.ts')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # --- server.ts: staff profile must come from Supabase and settings routes become async ---
          p = Path('server.ts')
          s = p.read_text()
          old_auth = '''    const authClient = createClient(supabaseUrl, supabaseAnonKey, {\n      auth: {\n        persistSession: false,\n        autoRefreshToken: false\n      }\n    });\n\n    const { data, error } = await authClient.auth.getUser(token);\n    if (error || !data.user) {\n      return res.status(401).json({ error: 'Sessão inválida ou expirada.' });\n    }\n\n    const email = data.user.email;\n    const staffUser = email ? dbManager.getUserByEmail(email) : undefined;\n    if (!staffUser || staffUser.status !== 'Ativo') {\n      return res.status(403).json({ error: 'Colaborador sem perfil ativo no hotel.' });\n    }\n'''
          new_auth = '''    const authClient = createClient(supabaseUrl, supabaseAnonKey, {\n      auth: {\n        persistSession: false,\n        autoRefreshToken: false\n      },\n      global: {\n        headers: { Authorization: `Bearer ${token}` }\n      }\n    });\n\n    const { data, error } = await authClient.auth.getUser(token);\n    if (error || !data.user) {\n      return res.status(401).json({ error: 'Sessão inválida ou expirada.' });\n    }\n\n    const email = data.user.email;\n    const { data: staffRow, error: staffError } = await authClient\n      .from('staff_users')\n      .select('*')\n      .eq('id', data.user.id)\n      .maybeSingle();\n    if (staffError) {\n      console.error('[Auth] Falha ao consultar staff_users no Supabase:', staffError);\n      return res.status(503).json({ error: 'Não foi possível validar o perfil do colaborador.' });\n    }\n    if (!staffRow || staffRow.active !== true) {\n      return res.status(403).json({ error: 'Colaborador sem perfil ativo no hotel.' });\n    }\n    const staffUser = {\n      id: staffRow.id,\n      email: staffRow.email || email || '',\n      fullName: staffRow.full_name,\n      role: staffRow.role,\n      sector: staffRow.sector,\n      status: 'Ativo',\n      permissions: Array.isArray(staffRow.permissions) ? staffRow.permissions : [],\n      createdAt: staffRow.created_at,\n      updatedAt: staffRow.updated_at\n    };\n'''
          if old_auth not in s:
              raise SystemExit('auth block not found in server.ts')
          s = s.replace(old_auth, new_auth, 1)

          s = s.replace("app.get('/api/public/settings', (req: Request, res: Response) => {", "app.get('/api/public/settings', async (req: Request, res: Response) => {")
          s = s.replace('    const settings = dbManager.getSettings();\n    const { hotelName, tagline, address, phone, email, currency, roomTypes, amenities, taxes, checkInTime, checkOutTime, logoUrl, primaryColor, secondaryColor } = settings as any;', '    const settings = await dbManager.getSettingsPersistent();\n    const { hotelName, tagline, address, phone, email, currency, roomTypes, amenities, taxes, checkInTime, checkOutTime, logoUrl, primaryColor, secondaryColor } = settings as any;', 1)

          s = s.replace("app.get('/api/settings', requireSupabaseAuth, requirePermission('manage_settings'), (req: Request, res: Response) => {", "app.get('/api/settings', requireSupabaseAuth, requirePermission('manage_settings'), async (req: Request, res: Response) => {")
          # Replace the next synchronous getSettings after protected settings route declaration.
          marker = "app.get('/api/settings'"
          idx = s.index(marker)
          tail = s[idx:]
          tail = tail.replace('    const settings = dbManager.getSettings();', '    const settings = await dbManager.getSettingsPersistent();', 1)
          s = s[:idx] + tail

          s = s.replace("app.put('/api/settings', requireSupabaseAuth, requirePermission('manage_settings'), (req: Request, res: Response) => {", "app.put('/api/settings', requireSupabaseAuth, requirePermission('manage_settings'), async (req: Request, res: Response) => {")
          s = s.replace('    const updated = dbManager.updateSettings(req.body);', '    const updated = await dbManager.updateSettingsPersistent(req.body);', 1)
          p.write_text(s)
          PY
      - name: Add phase documentation
        run: |
          cat > docs/FASE-02-02-SETTINGS-SUPABASE.md <<'EOF'
          # FASE 2.2 — hotel_settings e perfil de equipe no Supabase

          - `hotel_settings` passa a ser a fonte preferencial no backend quando o Supabase está configurado.
          - JSON permanece somente como cache/fallback transitório até a FASE 2.7.
          - leitura pública continua sanitizada pelo endpoint `/api/public/settings`.
          - gravações administrativas de settings usam upsert no Supabase.
          - autenticação do backend passa a resolver o perfil ativo diretamente em `public.staff_users`, pelo próprio JWT do usuário, em vez de buscar perfil no JSON.
          - nenhuma alteração visual foi realizada.
          - gerenciamento completo de múltiplos colaboradores e políticas administrativas de RLS será ampliado em checkpoint posterior; este passo remove a dependência do JSON do caminho crítico de autenticação.
          EOF
      - name: Validate production build
        run: |
          npm install
          npm run build
      - name: Commit phase
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/db.ts server.ts docs/FASE-02-02-SETTINGS-SUPABASE.md
          git commit -m "refactor: usar Supabase para settings e perfil autenticado" || exit 0
          git push
