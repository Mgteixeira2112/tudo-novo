name: Apply reservation alert navigation on fix branch

on:
  push:
    branches:
      - fix/alert-reservation-origin
    paths:
      - .github/workflows/apply-alert-reservation-origin.yml

permissions:
  contents: write

jobs:
  apply-branch-patch:
    if: github.ref == 'refs/heads/fix/alert-reservation-origin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alert-reservation-origin
          persist-credentials: true
      - name: Apply four guarded source edits
        run: |
          if [ ! -f scripts/patch_alert_reservation_origin.py ]; then
            echo 'Patch already removed; no action required.'
            exit 0
          fi
          python3 scripts/patch_alert_reservation_origin.py
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/reservationAlertNavigation.ts src/components/OperationalAlertsBell.tsx src/components/OperationalAlertsCenter.tsx src/components/ReservationsManager.tsx
          git commit -m 'fix: navigate reservation alerts to exact reservation'
          git push origin HEAD:refs/heads/fix/alert-reservation-origin
