name: Apply Kanban write hotfix
on:
  push:
    branches: [fix/pages-kanban-write-fallback]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-kanban-write-fallback
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Pages Kanban writes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/services/pagesData.ts')
          s = p.read_text()
          s = s.replace("import { Reservation, Room } from '../types.ts';", "import { KanbanTask, KitchenOrder, MenuItem, Reservation, Room } from '../types.ts';", 1)
          if 'createKanbanTaskInSupabase' not in s:
            s += '''\n\nfunction mapKanbanRow(r: any): KanbanTask {\n  return {\n    id: r.id, title: r.title, description: r.description || '', sector: r.sector,\n    status: r.status, priority: r.priority, roomNumber: r.room_number || undefined,\n    guestName: r.guest_name || undefined, assignedTo: r.assigned_to || undefined,\n    relatedType: r.related_type || undefined, relatedId: r.related_id || undefined,\n    createdAt: r.created_at, updatedAt: r.updated_at\n  } as KanbanTask;\n}\n\nfunction kanbanPayload(task: Partial<KanbanTask>) {\n  const payload: Record<string, any> = {};\n  const map: Record<string, string> = {\n    title: 'title', description: 'description', sector: 'sector', status: 'status', priority: 'priority',\n    roomNumber: 'room_number', guestName: 'guest_name', assignedTo: 'assigned_to',\n    relatedType: 'related_type', relatedId: 'related_id'\n  };\n  for (const [key, column] of Object.entries(map)) {\n    if (Object.prototype.hasOwnProperty.call(task, key)) payload[column] = (task as any)[key] ?? null;\n  }\n  return payload;\n}\n\nexport async function createKanbanTaskInSupabase(task: Omit<KanbanTask, 'id' | 'createdAt' | 'updatedAt'>): Promise<KanbanTask> {\n  const supabase = getSupabaseClient();\n  if (!supabase) throw new Error('Supabase não configurado.');\n  const now = new Date().toISOString();\n  const row = {\n    id: `task_${Date.now()}_${Math.floor(Math.random() * 10000)}`,\n    ...kanbanPayload(task),\n    created_at: now, updated_at: now\n  };\n  const { data, error } = await supabase.from('kanban_tasks').insert(row).select('*').single();\n  if (error) throw error;\n  return mapKanbanRow(data);\n}\n\nexport async function updateKanbanTaskInSupabase(id: string, updates: Partial<KanbanTask>): Promise<KanbanTask> {\n  const supabase = getSupabaseClient();\n  if (!supabase) throw new Error('Supabase não configurado.');\n  const payload = { ...kanbanPayload(updates), updated_at: new Date().toISOString() };\n  const { data, error } = await supabase.from('kanban_tasks').update(payload).eq('id', id).select('*').single();\n  if (error) throw error;\n  return mapKanbanRow(data);\n}\n\nexport async function deleteKanbanTaskInSupabase(id: string): Promise<{ success: boolean }> {\n  const supabase = getSupabaseClient();\n  if (!supabase) throw new Error('Supabase não configurado.');\n  const { error } = await supabase.from('kanban_tasks').delete().eq('id', id);\n  if (error) throw error;\n  return { success: true };\n}\n'''
          p.write_text(s)

          p = Path('src/services/api.ts')
          s = p.read_text()
          old_import = "import { loadKanbanTasksFromSupabase, loadKitchenOrdersFromSupabase, loadMenuItemsFromSupabase } from './pagesData.ts';"
          new_import = "import { createKanbanTaskInSupabase, deleteKanbanTaskInSupabase, loadKanbanTasksFromSupabase, loadKitchenOrdersFromSupabase, loadMenuItemsFromSupabase, updateKanbanTaskInSupabase } from './pagesData.ts';"
          s = s.replace(old_import, new_import, 1)
          old_create = '''  createTask: (task: Omit<KanbanTask, 'id' | 'createdAt' | 'updatedAt'>) =>\n    fetch(`${BASE_URL}/tasks`, {\n      method: 'POST',\n      headers: protectedHeaders(),\n      body: JSON.stringify(task),\n    }).then(r => handleResponse<KanbanTask>(r)),'''
          new_create = '''  createTask: (task: Omit<KanbanTask, 'id' | 'createdAt' | 'updatedAt'>) =>\n    fetch(`${BASE_URL}/tasks`, {\n      method: 'POST',\n      headers: protectedHeaders(),\n      body: JSON.stringify(task),\n    }).then(r => handleResponse<KanbanTask>(r)).catch(() => createKanbanTaskInSupabase(task)),'''
          if old_create not in s: raise SystemExit('createTask anchor not found')
          s = s.replace(old_create, new_create, 1)
          old_update = '''  updateTask: (id: string, updates: Partial<KanbanTask>) =>\n    fetch(`${BASE_URL}/tasks/${id}`, {\n      method: 'PATCH',\n      headers: protectedHeaders(),\n      body: JSON.stringify(updates),\n    }).then(r => handleResponse<KanbanTask>(r)),'''
          new_update = '''  updateTask: (id: string, updates: Partial<KanbanTask>) =>\n    fetch(`${BASE_URL}/tasks/${id}`, {\n      method: 'PATCH',\n      headers: protectedHeaders(),\n      body: JSON.stringify(updates),\n    }).then(r => handleResponse<KanbanTask>(r)).catch(() => updateKanbanTaskInSupabase(id, updates)),'''
          if old_update not in s: raise SystemExit('updateTask anchor not found')
          s = s.replace(old_update, new_update, 1)
          old_delete = "  deleteTask: (id: string) =>\n    fetch(`${BASE_URL}/tasks/${id}`, { method: 'DELETE', headers: protectedHeaders() }).then(r => handleResponse<{ success: boolean }>(r)),"
          new_delete = "  deleteTask: (id: string) =>\n    fetch(`${BASE_URL}/tasks/${id}`, { method: 'DELETE', headers: protectedHeaders() }).then(r => handleResponse<{ success: boolean }>(r)).catch(() => deleteKanbanTaskInSupabase(id)),"
          if old_delete not in s: raise SystemExit('deleteTask anchor not found')
          s = s.replace(old_delete, new_delete, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name "Mgteixeira2112"
          git config user.email "102971119+Mgteixeira2112@users.noreply.github.com"
          git add src/services/pagesData.ts src/services/api.ts
          git commit -m "fix: habilitar escrita Kanban no GitHub Pages" || exit 0
          git push origin HEAD:fix/pages-kanban-write-fallback