name: Apply Booking Search Button Fix
on:
  push:
    branches: [hotfix/booking-search-button]
    paths:
      - 'scripts/apply_booking_search_button.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/apply_booking_search_button.py
      - name: Install and build
        run: npm install && npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/OnlineBookingEngine.tsx
          git commit -m "fix: adicionar busca de disponibilidade no motor" || exit 0
          git push
