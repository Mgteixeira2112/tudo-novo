name: Apply hotfix Pages rooms
on:
  push:
    branches: [fix/pages-direct-supabase-rooms]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-direct-supabase-rooms
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch HotelContext
        run: |
          sed -i "/import { api, setApiAccessToken, hasApiAccessToken } from '..\/services\/api.ts';/a import { loadRoomsFromSupabase } from '../services/pagesData.ts';" src/context/HotelContext.tsx
          sed -i "/console.error('Error fetching hotel data:', err);/a\      const directRooms = await loadRoomsFromSupabase().catch(() => []);\n      setRooms(directRooms);" src/context/HotelContext.tsx
      - name: Validate
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/context/HotelContext.tsx
          git commit -m "fix: fallback direto de quartos no GitHub Pages" || exit 0
          git push
