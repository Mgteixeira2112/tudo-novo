name: Apply public/admin data split
on:
  push:
    branches: [refactor/fase-01-dados-publicos-admin]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fase-01-dados-publicos-admin
      - name: Patch public/admin split
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          p = Path('server.ts')
          s = p.read_text()
          marker = "// Settings (Front-end configurável)\n"
          public_route = """// Public hotel presentation settings (sanitized)\napp.get('/api/public/settings', (req: Request, res: Response) => {\n  try {\n    const settings = dbManager.getSettings();\n    const { hotelName, tagline, address, phone, email, currency, roomTypes, amenities, taxes, checkInTime, checkOutTime, logoUrl, primaryColor, secondaryColor } = settings as any;\n    res.json({ hotelName, tagline, address, phone, email, currency, roomTypes, amenities, taxes, checkInTime, checkOutTime, logoUrl, primaryColor, secondaryColor });\n  } catch (err: any) {\n    res.status(500).json({ error: err.message });\n  }\n});\n\n"""
          if public_route not in s:
              s = s.replace(marker, public_route + marker)
          repl = {
            "app.get('/api/supabase/status', (req: Request, res: Response) => {": "app.get('/api/supabase/status', requireSupabaseAuth, requirePermission('manage_settings'), (req: Request, res: Response) => {",
            "app.get('/api/supabase/schema-sql', (req: Request, res: Response) => {": "app.get('/api/supabase/schema-sql', requireSupabaseAuth, requirePermission('manage_settings'), (req: Request, res: Response) => {",
            "app.get('/api/guests', (req: Request, res: Response) => {": "app.get('/api/guests', requireSupabaseAuth, requirePermission('view_guests'), (req: Request, res: Response) => {",
            "app.get('/api/rooms', (req: Request, res: Response) => {": "app.get('/api/rooms', requireSupabaseAuth, requirePermission('view_rooms'), (req: Request, res: Response) => {",
            "app.get('/api/reservations', (req: Request, res: Response) => {": "app.get('/api/reservations', requireSupabaseAuth, requirePermission('view_checkinout'), (req: Request, res: Response) => {",
            "app.get('/api/minibar/items', (req: Request, res: Response) => {": "app.get('/api/minibar/items', requireSupabaseAuth, requirePermission('view_fnb'), (req: Request, res: Response) => {",
            "app.get('/api/minibar/consumptions', (req: Request, res: Response) => {": "app.get('/api/minibar/consumptions', requireSupabaseAuth, requirePermission('view_fnb'), (req: Request, res: Response) => {",
            "app.get('/api/kitchen/orders', (req: Request, res: Response) => {": "app.get('/api/kitchen/orders', requireSupabaseAuth, requirePermission('view_fnb'), (req: Request, res: Response) => {",
            "app.get('/api/tasks', (req: Request, res: Response) => {": "app.get('/api/tasks', requireSupabaseAuth, requirePermission('view_kanbans'), (req: Request, res: Response) => {",
            "app.get('/api/financial/transactions', (req: Request, res: Response) => {": "app.get('/api/financial/transactions', requireSupabaseAuth, requirePermission('view_financial'), (req: Request, res: Response) => {",
            "app.get('/api/financial/stats', (req: Request, res: Response) => {": "app.get('/api/financial/stats', requireSupabaseAuth, requirePermission('view_financial'), (req: Request, res: Response) => {",
          }
          for a,b in repl.items(): s = s.replace(a,b)
          p.write_text(s)

          p = Path('src/services/api.ts')
          s = p.read_text()
          if 'export function hasApiAccessToken' not in s:
              s = s.replace("export function setApiAccessToken(token?: string | null) {\n  apiAccessToken = token || null;\n}\n", "export function setApiAccessToken(token?: string | null) {\n  apiAccessToken = token || null;\n}\n\nexport function hasApiAccessToken() {\n  return Boolean(apiAccessToken);\n}\n")
          s = s.replace("  // Settings\n  getSettings: () => fetch(`${BASE_URL}/settings`).then(r => handleResponse<HotelSettings>(r)),", "  // Settings\n  getPublicSettings: () => fetch(`${BASE_URL}/public/settings`).then(r => handleResponse<HotelSettings>(r)),\n  getSettings: () => fetch(`${BASE_URL}/settings`, { headers: protectedHeaders() }).then(r => handleResponse<HotelSettings>(r)),")
          get_repls = {
            "getSupabaseStatus: () => fetch(`${BASE_URL}/supabase/status`).then": "getSupabaseStatus: () => fetch(`${BASE_URL}/supabase/status`, { headers: protectedHeaders() }).then",
            "getSupabaseSQL: () => fetch(`${BASE_URL}/supabase/schema-sql`).then": "getSupabaseSQL: () => fetch(`${BASE_URL}/supabase/schema-sql`, { headers: protectedHeaders() }).then",
            "getGuests: () => fetch(`${BASE_URL}/guests`).then": "getGuests: () => fetch(`${BASE_URL}/guests`, { headers: protectedHeaders() }).then",
            "getRooms: () => fetch(`${BASE_URL}/rooms`).then": "getRooms: () => fetch(`${BASE_URL}/rooms`, { headers: protectedHeaders() }).then",
            "getReservations: () => fetch(`${BASE_URL}/reservations`).then": "getReservations: () => fetch(`${BASE_URL}/reservations`, { headers: protectedHeaders() }).then",
            "getMinibarItems: () => fetch(`${BASE_URL}/minibar/items`).then": "getMinibarItems: () => fetch(`${BASE_URL}/minibar/items`, { headers: protectedHeaders() }).then",
            "return fetch(url).then(r => handleResponse<RoomMinibarConsumption[]>(r));": "return fetch(url, { headers: protectedHeaders() }).then(r => handleResponse<RoomMinibarConsumption[]>(r));",
            "getOrders: () => fetch(`${BASE_URL}/kitchen/orders`).then": "getOrders: () => fetch(`${BASE_URL}/kitchen/orders`, { headers: protectedHeaders() }).then",
            "return fetch(url).then(r => handleResponse<KanbanTask[]>(r));": "return fetch(url, { headers: protectedHeaders() }).then(r => handleResponse<KanbanTask[]>(r));",
            "getTransactions: () => fetch(`${BASE_URL}/financial/transactions`).then": "getTransactions: () => fetch(`${BASE_URL}/financial/transactions`, { headers: protectedHeaders() }).then",
            "getFinancialStats: () => fetch(`${BASE_URL}/financial/stats`).then": "getFinancialStats: () => fetch(`${BASE_URL}/financial/stats`, { headers: protectedHeaders() }).then",
          }
          for a,b in get_repls.items(): s = s.replace(a,b)
          p.write_text(s)

          p = Path('src/context/HotelContext.tsx')
          s = p.read_text()
          s = s.replace("import { api, setApiAccessToken } from '../services/api.ts';", "import { api, setApiAccessToken, hasApiAccessToken } from '../services/api.ts';")
          start = s.index('  const refreshData = useCallback(async () => {')
          end = s.index('\n\n  const updateSettings', start)
          new_refresh = '''  const clearPrivateData = useCallback(() => {\n    setRooms([]); setGuests([]); setReservations([]); setTasks([]); setTransactions([]); setStats(null); setSupabaseStatus(null); setAllUsers([]);\n  }, []);\n\n  const refreshData = useCallback(async () => {\n    try {\n      if (!hasApiAccessToken()) {\n        const publicSettings = await api.getPublicSettings();\n        setSettings(publicSettings);\n        clearPrivateData();\n        setError(null);\n        return;\n      }\n      const [fetchedSettings, fetchedRooms, fetchedGuests, fetchedReservations, fetchedTasks, fetchedTransactions, fetchedStats, fetchedSupabase, fetchedUsers] = await Promise.all([\n        api.getSettings(), api.getRooms(), api.getGuests(), api.getReservations(), api.getTasks(), api.getTransactions(), api.getFinancialStats(), api.getSupabaseStatus().catch(() => null), api.getUsers().catch(() => [])\n      ]);\n      setSettings(fetchedSettings); setRooms(fetchedRooms); setGuests(fetchedGuests); setReservations(fetchedReservations); setTasks(fetchedTasks); setTransactions(fetchedTransactions); setStats(fetchedStats); setSupabaseStatus(fetchedSupabase); setAllUsers(fetchedUsers); setError(null);\n    } catch (err: any) {\n      console.error('Error fetching hotel data:', err);\n      setError(err.message || 'Erro ao carregar dados do servidor.');\n    } finally { setLoading(false); }\n  }, [clearPrivateData]);'''
          s = s[:start] + new_refresh + s[end:]
          s = s.replace("      setActiveAdminTab(defaultTab);\n      return result.user;", "      setActiveAdminTab(defaultTab);\n      await refreshData();\n      return result.user;")
          s = s.replace("    setCurrentUser(null);\n    setMode('booking');", "    setCurrentUser(null);\n    clearPrivateData();\n    setMode('booking');\n    await refreshData().catch(() => {});")
          restore_anchor = "        const defaultTab = getDefaultTabForUser(staff);\n        setActiveAdminTab(defaultTab);"
          s = s.replace(restore_anchor, restore_anchor + "\n        await refreshData();")
          s = s.replace("  useEffect(() => {\n    const unsub = subscribeToStaffUsersRealtime(", "  useEffect(() => {\n    if (!currentUser) return;\n    const unsub = subscribeToStaffUsersRealtime(")
          s = s.replace("  }, [supabaseStatus?.supabaseUrl, supabaseStatus?.supabaseAnonKey]);\n\n  // Real-time polling", "  }, [currentUser?.id, supabaseStatus?.supabaseUrl, supabaseStatus?.supabaseAnonKey]);\n\n  // Real-time polling")
          poll_anchor = "  useEffect(() => {\n    const interval = setInterval(() => {\n      Promise.all(["
          s = s.replace(poll_anchor, "  useEffect(() => {\n    if (!currentUser) return;\n    const interval = setInterval(() => {\n      Promise.all([")
          s = s.replace("  }, []);\n\n  return (\n    <HotelContext.Provider", "  }, [currentUser?.id]);\n\n  return (\n    <HotelContext.Provider")
          p.write_text(s)

          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace("  useEffect(() => {\n    api\n      .getOrders()", "  useEffect(() => {\n    if (!currentUser) return;\n    api\n      .getOrders()")
          s = s.replace("  }, []);\n\n  // 2. Supabase Realtime channel subscription", "  }, [currentUser?.id]);\n\n  // 2. Supabase Realtime channel subscription", 1)
          s = s.replace("  useEffect(() => {\n    const unsubscribe = subscribeToKitchenOrdersRealtime(", "  useEffect(() => {\n    if (!currentUser) return;\n    const unsubscribe = subscribeToKitchenOrdersRealtime(")
          s = s.replace("  }, [supabaseStatus?.supabaseUrl, supabaseStatus?.supabaseAnonKey, triggerRoomServiceToast, refreshData]);", "  }, [currentUser?.id, supabaseStatus?.supabaseUrl, supabaseStatus?.supabaseAnonKey, triggerRoomServiceToast, refreshData]);")
          s = s.replace("  useEffect(() => {\n    const interval = setInterval(async () => {", "  useEffect(() => {\n    if (!currentUser) return;\n    const interval = setInterval(async () => {")
          s = s.replace("  }, [triggerRoomServiceToast, supabaseStatus?.connected]);", "  }, [currentUser?.id, triggerRoomServiceToast, supabaseStatus?.connected]);")
          s = s.replace("            <span className=\"text-[#E6E3D8]\">|</span>\n            <span>Wi-Fi: <strong className=\"text-[#3D4035]\">{settings?.wifiPassword || 'Horizonte@2025'}</strong></span>\n", "")
          p.write_text(s)

          Path('docs/FASE-01-05-PUBLIC-ADMIN-DATA.md').write_text("# FASE 1.5 — Separação de dados públicos e administrativos\n\n- /api/public/settings entrega apenas campos sanitizados.\n- Dados operacionais exigem autenticação/permissão.\n- Realtime e polling operacional só rodam para colaborador autenticado.\n- POST de reserva online permanece público.\n")
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.ts src/services/api.ts src/context/HotelContext.tsx src/App.tsx docs/FASE-01-05-PUBLIC-ADMIN-DATA.md
          git commit -m "security: split public and administrative data access" || exit 0
          git push
