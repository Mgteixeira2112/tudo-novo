name: Apply Booking Layout Fix
on:
  push:
    branches: [refactor/fase-03-01-reservas-atomicas]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fase-03-01-reservas-atomicas
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply layout patch
        run: python scripts/apply_booking_layout_fix.py
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/OnlineBookingEngine.tsx
          git commit -m "fix: tornar ações de reserva visíveis no desktop"
          git push
