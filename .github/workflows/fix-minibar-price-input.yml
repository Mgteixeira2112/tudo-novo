name: Fix minibar price input
on:
  push:
    branches:
      - fix/minibar-price-input
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/minibar-price-input
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/RoomsAndInventoryManager.tsx')
          s=p.read_text()
          old='''                  <input\n                    type="number"\n                    step="0.5"\n                    min="1"\n                    required\n                    value={minibarItemForm.price}\n                    onChange={e => setMinibarItemForm(prev => ({ ...prev, price: Number(e.target.value) }))}\n                    className="w-full px-3 py-2 text-xs border border-[#E6E3D8] rounded-xl bg-[#FDFBF7] text-[#2C3327] outline-none focus:ring-2 focus:ring-[#588157]"\n                  />'''
          new='''                  <div className="relative">\n                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-[#6B705C]">R$</span>\n                    <input\n                      type="text"\n                      inputMode="decimal"\n                      required\n                      value={Number(minibarItemForm.price || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\n                      onFocus={e => e.currentTarget.select()}\n                      onChange={e => {\n                        const raw = e.target.value.replace(/[^0-9]/g, '');\n                        const value = raw ? Number(raw) / 100 : 0;\n                        setMinibarItemForm(prev => ({ ...prev, price: value }));\n                      }}\n                      className="w-full pl-9 pr-3 py-2 text-xs border border-[#E6E3D8] rounded-xl bg-[#FDFBF7] text-[#2C3327] outline-none focus:ring-2 focus:ring-[#588157]"\n                      placeholder="0,00"\n                    />\n                  </div>'''
          if old not in s: raise SystemExit('price input block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/RoomsAndInventoryManager.tsx
          git diff --cached --quiet || git commit -m "fix: usar campo monetário no preço do frigobar"
          git push
