name: Fix frigobar and room service Pages
on:
  push:
    branches:
      - fix/frigobar-roomservice-pages
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frigobar-roomservice-pages
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/patches/fix-frigobar-roomservice-pages.py
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/financeInventoryPages.ts src/services/pagesData.ts src/services/api.ts
          git diff --cached --quiet || git commit -m "fix: integrar frigobar e room service no GitHub Pages"
          git push
