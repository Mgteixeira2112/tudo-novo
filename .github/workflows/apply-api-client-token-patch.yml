name: Apply API client token patch

on:
  push:
    branches:
      - refactor/fase-01-seguranca-api
    paths:
      - '.github/workflows/apply-api-client-token-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/fase-01-seguranca-api

      - name: Apply client token patch
        shell: bash
        run: |
          echo '' | base64 -d | python3

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No client token changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/api.ts src/context/HotelContext.tsx
          git commit -m "security: send Supabase bearer token on protected admin calls"
          git push origin HEAD:refactor/fase-01-seguranca-api
