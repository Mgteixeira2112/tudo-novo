name: Apply RBAC login patch

on:
  push:
    branches:
      - refactor/fase-01-rbac-login
    paths:
      - '.github/workflows/apply-rbac-login-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/fase-01-rbac-login

      - name: Apply RBAC/login patch
        shell: bash
        run: |
          echo '' | base64 -d | python3

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/App.tsx src/context/HotelContext.tsx src/components/StaffLogin.tsx src/services/api.ts src/services/supabase.ts
          git commit -m "security: enforce staff login, session restore and server RBAC"
          git push origin HEAD:refactor/fase-01-rbac-login
