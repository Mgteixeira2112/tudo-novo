name: Hotfix Revert Price
on:
  push:
    branches: [hotfix/revert-minibar-price-runtime]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/revert-minibar-price-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revert risky price input
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/RoomsAndInventoryManager.tsx')
          s=p.read_text()
          old='''                  <div className="relative">\n                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-[#6B705C]">R$</span>\n                    <input\n                      type="text"\n                      inputMode="decimal"\n                      required\n                      value={Number(minibarItemForm.price || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}\n                      onFocus={e => e.currentTarget.select()}\n                      onChange={e => {\n                        const raw = e.target.value.replace(/[^0-9]/g, '');\n                        const value = raw ? Number(raw) / 100 : 0;\n                        setMinibarItemForm(prev => ({ ...prev, price: value }));\n                      }}\n                      className="w-full pl-9 pr-3 py-2 text-xs border border-[#E6E3D8] rounded-xl bg-[#FDFBF7] text-[#2C3327] outline-none focus:ring-2 focus:ring-[#588157]"\n                      placeholder="0,00"\n                    />\n                  </div>'''
          new='''                  <input\n                    type="number"\n                    step="0.01"\n                    min="0"\n                    required\n                    value={minibarItemForm.price}\n                    onChange={e => setMinibarItemForm(prev => ({ ...prev, price: Number(e.target.value) }))}\n                    className="w-full px-3 py-2 text-xs border border-[#E6E3D8] rounded-xl bg-[#FDFBF7] text-[#2C3327] outline-none focus:ring-2 focus:ring-[#588157]"\n                  />'''
          if old not in s:
              raise SystemExit('price block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/RoomsAndInventoryManager.tsx
          git commit -m "hotfix: restaurar campo de preço estável"
          git push
