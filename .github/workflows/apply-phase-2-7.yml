name: Apply Phase 2.7
on:
  push:
    branches: [refactor/fase-02-07-supabase-source-truth]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fase-02-07-supabase-source-truth
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply production source-of-truth rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/db.ts')
          s = p.read_text()
          marker = "const DB_FILE_PATH = path.join(process.cwd(), 'hotel_database.json');\n"
          addition = marker + "const ALLOW_LOCAL_JSON_FALLBACK = process.env.NODE_ENV !== 'production' && process.env.ALLOW_LOCAL_JSON_FALLBACK !== 'false';\n"
          if 'ALLOW_LOCAL_JSON_FALLBACK' not in s:
              s = s.replace(marker, addition)

          load_marker = '  private loadDatabase(): HotelDatabase {\n'
          prod_init = '''  private loadDatabase(): HotelDatabase {\n    if (!ALLOW_LOCAL_JSON_FALLBACK) {\n      // Production must never bootstrap operational data from JSON/demo seeds.\n      return {\n        settings: defaultSettings,\n        guests: [], rooms: [], reservations: [], minibarItems: [], consumptions: [],\n        menuItems: [], orders: [], tasks: [], transactions: [], inventoryItems: [],\n        stockMovements: [], users: [], lastUpdated: new Date().toISOString()\n      };\n    }\n'''
          if 'Production must never bootstrap operational data' not in s:
              s = s.replace(load_marker, prod_init)

          persist_marker = '  private persistToFile(dataToSave: HotelDatabase) {\n'
          if 'if (!ALLOW_LOCAL_JSON_FALLBACK) return;' not in s:
              s = s.replace(persist_marker, persist_marker + '    if (!ALLOW_LOCAL_JSON_FALLBACK) return;\n')

          # Any migrated persistent repository must fail closed in production instead of using JSON.
          s = re.sub(
              r'if \(!this\.supabase\) return (this\.[A-Za-z0-9_]+\([^;]*\));',
              r"if (!this.supabase) { if (!ALLOW_LOCAL_JSON_FALLBACK) throw new Error('Supabase é obrigatório em produção.'); return \1; }",
              s
          )
          s = s.replace("console.warn('[Supabase] Falha", "if (!ALLOW_LOCAL_JSON_FALLBACK) throw err;\n      console.warn('[Supabase] Falha")
          s = s.replace('usando fallback JSON temporário:', 'usando fallback JSON apenas em desenvolvimento:')
          s = s.replace('// Transitional repository: Supabase is preferred when the server has credentials;\n  // the local JSON object remains a temporary cache/fallback until Phase 2.7.', '// Production source of truth: Supabase. JSON fallback is restricted to local development only.')
          p.write_text(s)

          p = Path('server/operationalSupabase.ts')
          s = p.read_text()
          old = "  if (!url || !key) return null;"
          new = "  if (!url || !key) {\n    if (process.env.NODE_ENV === 'production') throw new Error('Supabase é obrigatório em produção.');\n    return null;\n  }"
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('server.ts')
          s = p.read_text()
          anchor = "// -------------------------------------------------------------\n// API Endpoints\n// -------------------------------------------------------------\n"
          guard = '''// -------------------------------------------------------------\n// API Endpoints\n// -------------------------------------------------------------\n\n// Phase 2.7: endpoints below this list still use the legacy in-memory/JSON DB on the Express server.\n// They are intentionally blocked in production so JSON can never become a second source of truth.\n// GitHub Pages uses authenticated direct Supabase repositories for these modules.\nfunction blockLegacyJsonPersistenceInProduction(req: Request, res: Response, next: NextFunction) {\n  if (process.env.NODE_ENV === 'production') {\n    return res.status(503).json({\n      error: 'Endpoint legado desabilitado em produção. Use a camada Supabase.'\n    });\n  }\n  return next();\n}\n\napp.use(['/api/minibar', '/api/financial', '/api/inventory'], blockLegacyJsonPersistenceInProduction);\n'''
          if 'blockLegacyJsonPersistenceInProduction' not in s:
              s = s.replace(anchor, guard)
          p.write_text(s)

          d = Path('docs/FASE-02-07-SUPABASE-FONTE-UNICA.md')
          d.write_text('''# FASE 2.7 — Supabase como fonte única de produção\n\n- `NODE_ENV=production` não lê nem grava `hotel_database.json`.\n- Repositórios persistentes migrados falham de forma explícita se o Supabase estiver indisponível; não retornam dados JSON.\n- Kanban, cardápio e pedidos exigem Supabase em produção.\n- Rotas Express ainda legadas de Frigobar, Financeiro e Inventário são bloqueadas em produção para impedir dupla fonte de verdade.\n- O frontend publicado no GitHub Pages continua usando os repositórios diretos autenticados do Supabase para esses módulos.\n- Desenvolvimento local pode manter fallback JSON, controlável por `ALLOW_LOCAL_JSON_FALLBACK=false`.\n\n## Critério de segurança\nFalha de Supabase em produção deve ser visível como erro; nunca deve resultar em dados demo/JSON aparentemente válidos.\n''')
          PY
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Verify production JSON guard
        run: |
          grep -q "ALLOW_LOCAL_JSON_FALLBACK" server/db.ts
          grep -q "blockLegacyJsonPersistenceInProduction" server.ts
          grep -q "Supabase é obrigatório em produção" server/operationalSupabase.ts
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/db.ts server/operationalSupabase.ts server.ts docs/FASE-02-07-SUPABASE-FONTE-UNICA.md
          git commit -m "refactor: tornar Supabase fonte única em produção"
          git push
