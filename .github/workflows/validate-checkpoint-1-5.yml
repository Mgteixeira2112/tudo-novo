name: Validate checkpoint 1.5
on:
  push:
    branches: [refactor/fase-01-dados-publicos-admin]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Full production build
        run: npm run build
      - name: Verify public/admin boundaries
        run: |
          grep -q "app.get('/api/public/settings'" server.ts
          grep -q "requirePermission('view_guests')" server.ts
          grep -q "requirePermission('view_financial')" server.ts
          grep -q "getPublicSettings" src/services/api.ts
          ! grep -q "Wi-Fi: <strong" src/App.tsx
