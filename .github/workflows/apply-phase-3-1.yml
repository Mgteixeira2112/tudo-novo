name: Apply Phase 3.1
on:
  push:
    branches:
      - refactor/fase-03-01-reservas-atomicas
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fase-03-01-reservas-atomicas
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/apply_phase_3_1.py
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Verify integration
        run: |
          grep -q "createReservationAtomicInSupabase" src/services/pagesData.ts
          grep -q "isGitHubPagesRuntime" src/services/api.ts
          grep -q "create_reservation_atomic" supabase/migrations/20260903095000_fase_03_01_reservas_atomicas.sql
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/pagesData.ts src/services/api.ts docs/FASE-03-01-RESERVAS-ATOMICAS.md
          git commit -m "feat: integrar motor de reservas à RPC atômica"
          git push
