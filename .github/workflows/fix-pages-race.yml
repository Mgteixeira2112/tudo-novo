name: Fix Pages deployment race
on:
  push:
    branches:
      - fix/pages-deploy-race
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-deploy-race
      - name: Patch deploy workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml')
          s=p.read_text()
          old='''    steps:\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n'''
          new='''    steps:\n      # O repositório ainda dispara também o pipeline legado pages-build-deployment (Jekyll).\n      # Esperamos esse pipeline terminar para que o artefato Vite seja sempre o último publicado.\n      - name: Wait for legacy Pages pipeline\n        run: sleep 45\n\n      - name: Deploy to GitHub Pages\n        id: deployment\n        uses: actions/deploy-pages@v4\n'''
          if old not in s: raise SystemExit('deploy block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/deploy-pages.yml
          git diff --cached --quiet || git commit -m "fix: garantir deploy Vite após pipeline legado do Pages"
          git push
