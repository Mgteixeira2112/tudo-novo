name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testes offline do validador operacional
        run: python3 -m unittest discover -s tests -p 'test_render_operational_audit.py' -v

      - name: Testes offline de escopo RBAC
        run: python3 -m unittest discover -s tests -p 'test_rbac_active_staff_policies.py' -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck legacy baseline (advisory)
        continue-on-error: true
        run: npm run lint

      - name: Build frontend
        run: npx vite build
