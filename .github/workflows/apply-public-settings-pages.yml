name: Apply Public Settings Pages Fix
on:
  push:
    branches: [hotfix/public-settings-pages]
    paths:
      - 'scripts/apply_public_settings_pages.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python scripts/apply_public_settings_pages.py
      - name: Install and build
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/pagesData.ts src/services/api.ts
          git commit -m "fix: carregar configurações públicas do Supabase no Pages" || exit 0
          git push
