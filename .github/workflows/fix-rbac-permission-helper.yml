name: Fix RBAC permission helper

on:
  push:
    branches:
      - refactor/fase-01-rbac-login
    paths:
      - '.github/workflows/fix-rbac-permission-helper.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/fase-01-rbac-login
      - name: Insert permission helper
        shell: bash
        run: |
          echo '' | base64 -d | python3
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix: add server RBAC permission helper"
          git push origin HEAD:refactor/fase-01-rbac-login
