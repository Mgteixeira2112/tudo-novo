name: Apply API security patch

on:
  push:
    branches:
      - refactor/fase-01-seguranca-api
    paths:
      - '.github/workflows/apply-security-api-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/fase-01-seguranca-api

      - name: Apply security middleware
        shell: bash
        run: |
          echo '' | base64 -d | python3

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "security: require Supabase bearer token for admin mutations"
          git push origin HEAD:refactor/fase-01-seguranca-api
