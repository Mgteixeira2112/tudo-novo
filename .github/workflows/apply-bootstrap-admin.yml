name: Apply bootstrap admin
on:
  push:
    branches: [refactor/fase-01-bootstrap-admin]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/fase-01-bootstrap-admin
      - name: Patch bootstrap admin flow
        run: python -c "import base64;exec(base64.b64decode('C...'))"
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/supabase.ts src/context/HotelContext.tsx src/components/StaffLogin.tsx docs/FASE-01-05-1-BOOTSTRAP-ADMIN.md
          git commit -m "feat: add secure first-admin bootstrap via Supabase" || exit 0
          git push
