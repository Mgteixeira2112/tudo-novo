name: Auditoria operacional (somente leitura)

on:
  workflow_dispatch:
  schedule:
    # Diariamente 08:17 em Brasilia (11:17 UTC).
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: operational-audit
  cancel-in-progress: false

jobs:
  audit:
    # Inerte ate ativacao explicita: nenhuma auditoria de banco ocorre sem secret.
    if: ${{ github.ref == 'refs/heads/main' && (vars.GOVERMIX_AUDIT_ENABLED == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUDIT_DATABASE_URL: ${{ secrets.GOVERMIX_AUDIT_DATABASE_URL }}
      PGOPTIONS: '-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirmar configuracao segura
        shell: bash
        run: |
          if [[ -z "$AUDIT_DATABASE_URL" ]]; then
            echo '::error::Configure GOVERMIX_AUDIT_DATABASE_URL como secret de uma conta exclusiva sem acesso a tabelas. Veja docs/AUDITORIA-AUTOMATICA.md.'
            exit 1
          fi
          if [[ "$AUDIT_DATABASE_URL" != postgres://* && "$AUDIT_DATABASE_URL" != postgresql://* ]]; then
            echo '::error::O secret deve conter uma connection string PostgreSQL valida.'
            exit 1
          fi

      - name: Instalar cliente PostgreSQL
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null

      - name: Bloquear identidade privilegiada, dados invisiveis ou acesso bruto
        shell: bash
        run: |
          preflight_result="$(psql "$AUDIT_DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -f supabase/audits/audit_access_preflight.sql)"
          if [[ "$preflight_result" != 'OK' ]]; then
            echo '::error::Preflight falhou. Role deve ser govermix_audit_reader, com acesso apenas as views agregadas e sem escrita/BYPASSRLS.'
            exit 1
          fi

      - name: Consultar somente os 17 resultados agregados
        shell: bash
        run: |
          mkdir -p audit-output
          psql "$AUDIT_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 --csv \
            -c 'SELECT check_name,issues,result,checks_total,failed_checks,issues_total FROM govermix_audit.operational_integrity ORDER BY check_name' \
            > audit-output/results.csv

      - name: Validar resultado e gerar relatorio
        shell: bash
        run: |
          python3 scripts/render_operational_audit.py \
            audit-output/results.csv audit-output/report.md \
            --commit "$GITHUB_SHA"

      - name: Publicar resumo na execucao
        if: always()
        shell: bash
        run: |
          if [[ -f audit-output/report.md ]]; then
            cat audit-output/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Auditoria **nao executada** ou sem relatorio: consultar o job com falha. Nao homologada.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar evidencias (somente agregados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-audit-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14
